name = "vault-coop"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# KV namespace stores three short-TTL'd record families — see Backend/README.md
# for the exact layout. Binding name kept as `LOBBIES` for backward compat
# with earlier deployments; today it's a generic presence/session store.
#
# Create with:
#   make kv-create
# then paste the IDs here.
[[kv_namespaces]]
binding = "LOBBIES"
id = "050406109a854de7b516c057cdbf75f6"
preview_id = "e015073f0d2147f5b8610116e094402d"

# Worker secrets — set via `make secrets`. Never commit them.
[vars]
# IMPORTANT: this MUST match the deployed URL for OpenID round-trips to work.
PUBLIC_BASE_URL = "https://vault-coop.coreycrooks.workers.dev"
STS_APP_ID = "2868840"
# Comma-separated list of extra hosts allowed as sign-in return URLs.
# `app.spirevault.app` and `thevault://...` and localhost are bundled into the
# code allowlist (see src/auth.ts). Anything listed here is appended to that.
# Pages preview hosts stay listed so QA on preview URLs keeps working.
ALLOWED_RETURN_HOSTS = "spirevault.app,vault-web-e90.pages.dev,vault-site-3ki.pages.dev"

# Co-op Lobby Beta server-side kill switch.
#   COOP_LOBBY_BETA_KILL = "1"        → forces every client back to Classic
#   COOP_LOBBY_BETA_ENABLED = "0"     → same effect via the explicit flag
#   COOP_LOBBY_BETA_ENABLED = "1"     → server-confirms Beta is live (default)
# Flip with `wrangler secret put COOP_LOBBY_BETA_KILL` and the next poll
# (≤15s for visible tabs, ≤60s for hidden) flips users without a deploy.
# Removing the var entirely also removes the flag from /coop/state, which
# leaves user choice (per-browser localStorage) intact.
COOP_LOBBY_BETA_ENABLED = "1"

# Local-dev environment override. Activated by running
#   `npx wrangler dev --env localdev`
# which flips on the `_debug/*` test routes used by
# `Backend/scripts/verify-coop-lobbies.mjs`. The production deploy
# (`make deploy`) does NOT use this env, so production never exposes
# the debug surface.
[env.localdev.vars]
PUBLIC_BASE_URL = "http://127.0.0.1:8787"
STS_APP_ID = "2868840"
ALLOWED_RETURN_HOSTS = "spirevault.app,localhost,127.0.0.1"
LOCAL_DEBUG = "1"
DEV_COOP_SANDBOX = "1"

[[env.localdev.kv_namespaces]]
binding = "LOBBIES"
id = "050406109a854de7b516c057cdbf75f6"
preview_id = "e015073f0d2147f5b8610116e094402d"

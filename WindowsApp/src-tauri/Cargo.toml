[package]
name    = "the-vault"
version = "0.9.9"
edition = "2021"

[lib]
name = "the_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "the-vault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell           = "2"
tauri-plugin-fs              = "2"
tauri-plugin-dialog          = "2"
tauri-plugin-updater         = "2"
tauri-plugin-process         = "2"
tauri-plugin-os              = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
notify      = "6"          # cross-platform file watcher (ReadDirectoryChangesW on Windows)
base64      = "0.22"
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"

# Screen capture — wraps DXGI/GDI on Windows, IOSurface on macOS, XCB on Linux.
screenshots = "0.8"
image       = { version = "0.25", features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-native API bindings for WDA_EXCLUDEFROMCAPTURE (OBS invisibility).
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

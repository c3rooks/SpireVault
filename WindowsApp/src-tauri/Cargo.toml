[package]
name    = "the-vault"
version = "0.9.9"
edition = "2021"

[lib]
name = "the_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "the-vault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell           = "2"
tauri-plugin-fs              = "2"
tauri-plugin-dialog          = "2"
# Updater intentionally NOT included — the wrapper loads the live cloud app
# at https://app.spirevault.app, so "updates" are just a browser reload. We
# avoid shipping auto-update infrastructure (and the signing-key plumbing it
# demands) until/unless the wrapper needs to ship genuinely native changes.
tauri-plugin-process         = "2"
tauri-plugin-os              = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
notify      = "6"          # cross-platform file watcher (ReadDirectoryChangesW on Windows)
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"

# Screen capture (`screenshots` + `image`) and OBS-invisibility deps
# (`windows`, `raw-window-handle`) intentionally removed from the v0.9.9
# thin-wrapper MVP — the latter two surface a Tauri 2 re-export gap, and
# the screenshots crate is locked to an older `image` crate API. Both
# features live in git history and can be revived later when Run Coach
# desktop enhancements are re-introduced. The cloud app remains the
# source of truth for Run Coach screenshots in this release (the web
# companion uses navigator.mediaDevices.getDisplayMedia).

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
